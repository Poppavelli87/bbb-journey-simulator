<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBB Consumer Journey Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="card app-header">
      <p class="eyebrow">Educational Demo</p>
      <h1>BBB Consumer Journey Simulator</h1>
      <p class="subtitle">How trust shapes the decision to hire a roofer.</p>
      <nav id="stageTracker" class="stage-tracker" aria-label="Consumer journey stages"></nav>
    </header>

    <main class="app-main">
      <section id="stageContainer" class="card stage-panel" aria-live="polite"></section>
      <aside id="humorContainer" class="card humor-panel"></aside>
    </main>
  </div>

  <footer class="app-footer">
    BBB Accreditation is a signal of a business's commitment to ethical marketplace practices and accountability. BBB does not guarantee outcomes.
  </footer>

  <script src="app.js"></script>
</body>
</html>
